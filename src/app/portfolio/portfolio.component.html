<div style="padding-top: 10px; "></div>

<form class="pure-form" style="text-align: right; padding: 1em;">
  <label for="filter">Filter:</label> &nbsp;
  @if (tags$ | async; as tags) {
    <select id="filter" [value]="selectedTag" (change)="onTagChanged(($any($event.target)).value)">
      @for (tag of tags; track tag) {
        <option [value]="tag">{{tag}}</option>
      }
    </select>
  }
</form>

@if (photos$ | async; as photos) {
  <abma-photo-gallery [photos]="photos"></abma-photo-gallery>
}
