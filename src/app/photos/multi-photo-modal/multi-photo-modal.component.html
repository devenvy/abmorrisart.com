<div #modalContainer class="modal" (swipeleft)="next()" (swiperight)="back()" (swipeup)="next()" (swipedown)="back()">
  <button class="close" type="button" aria-label="Close" (click)="modalClosed.emit()">&times;</button>
  @if (activePhoto) {
    <img class="modal-content" alt="{{activePhoto!.title}}" [src]="activePhoto!.original" />
  }
</div>
