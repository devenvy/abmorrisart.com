<section class="pure-g">

  @for (photo of photos; track photo) {
    <div class="pure-u-2 pure-u-md-1-3 pure-u-lg-1-6 photo-container">
      <picture>
        <source media="(max-width: 799px)" [srcset]="photo.small">
        <source media="(min-width: 800px)" [srcset]="photo.medium">
        <img class="pure-img" [src]="photo.original" [alt]="photo.title" role="button" tabindex="0" (click)="onPhotoSelected(photo)" (keyup.enter)="onPhotoSelected(photo)" (keyup.space)="onPhotoSelected(photo)">
      </picture>
    </div>
  }

  @if (selectedPhoto) {
    <abma-multiphoto-modal [activePhoto]="selectedPhoto" [photos]="photos" (modalClosed)="onModalClosed()"></abma-multiphoto-modal>
  }
</section>
