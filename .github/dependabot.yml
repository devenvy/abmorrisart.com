# Dependabot config. The site is a static Hugo build with no package manifest
# (no npm/go modules), so the only thing worth keeping current is the GitHub
# Actions used in CI. This is low-noise and does not reintroduce a dependency
# vulnerability feed.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
