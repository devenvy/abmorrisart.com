{{/* One gallery item. Context: a single photo entry from data/photos.json. */}}
<div class="pure-u-2 pure-u-md-1-3 pure-u-lg-1-6 photo-container" data-tags="{{ delimit .tags " " }}">
    <picture>
        <source media="(max-width: 799px)" srcset="{{ .small }}">
        <source media="(min-width: 800px)" srcset="{{ .medium }}">
        <img class="pure-img" src="{{ .original }}" alt="{{ .title }}" loading="lazy" />
    </picture>
</div>
