{{ $opts := dict "minify" (not hugo.IsDevelopment) "target" "es2017" }}
{{ with resources.Get "js/main.js" | js.Build $opts }}
  {{ if hugo.IsProduction }}
    {{ with . | fingerprint }}
      <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
    {{ end }}
  {{ else }}
    <script src="{{ .RelPermalink }}" defer></script>
  {{ end }}
{{ end }}
