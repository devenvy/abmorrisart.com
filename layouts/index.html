{{ define "main" }}
<section class="hero">

    <div class="hero-title">
        Amber Morris
        <div class="hero-subtitle">Educator</div>
        <div class="hero-subtitle">Visual Artist</div>
    </div>

    <div class="hero-links pure-g">
        <div class="pure-u-1-2 hero-link-container">
            <a href="/portfolio/" class="pure-button bg-green">See My Work</a>
        </div>
        <div class="pure-u-1-2 hero-link-container">
            <a href="/contact/" class="pure-button bg-pink">Get in Touch</a>
        </div>
    </div>

    <a href="#recent-works" style="position: absolute; bottom: 15px;">
        <a id="recent-works"></a>
        <img src="/assets/icons/arrow-down.svg" alt="jump down" />
    </a>
</section>

<section class="portfolio-preview">

    <h2 class="section-title">My Recent Works</h2>
    {{ partial "gallery.html" (dict "photos" (first 6 hugo.Data.photos)) }}

    <div style="text-align: center; margin-top: 20px;">
        <a href="/portfolio/" style="font-size: 20px;" class="pure-button bg-pink txt-white">View More</a>
    </div>

</section>
{{ end }}
